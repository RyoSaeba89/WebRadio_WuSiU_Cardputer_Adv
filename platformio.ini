; WebRadio WuSiU v2.0.0 (Cardputer ADV): original + more stations (100) + back key (`) in the station list.
; The original is built with the Arduino IDE (ESP32 core 3.2.1 + ESP32-audioI2S 3.1-3.2.x, works without PSRAM): same base here.
[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv
; same board definition as the Arduino IDE ("M5Cardputer"): default SPI/SD pins 40/39/14/12
; (with the generic devkit pins, SD.begin() takes GPIO11 = Cardputer ADV keyboard interrupt)
board_build.variant = m5stack_cardputer
board_build.flash_mode = dio
build_flags =
	-DESP32S3
	-DARDUINO_M5STACK_CARDPUTER
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	m5stack/M5Cardputer @ ^1.1.1
	m5stack/M5Unified @ ^0.2.11
	m5stack/M5GFX @ ^0.2.17
	https://github.com/schreibfaul1/ESP32-audioI2S.git#3.2.1
